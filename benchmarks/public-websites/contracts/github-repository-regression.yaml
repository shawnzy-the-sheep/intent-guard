version: 1
id: github-repository-regression
page:
  route: /microsoft/vscode
user:
  role: signed-out public visitor
goal:
  primary: Identify the repository before reading its contextual About information
entities:
  primary:
    priority: primary
    selectors:
      - main [itemprop=name] a
  context:
    priority: contextual
    selectors:
      - main div[class*=HideWhenNarrow] > h2[class*=SidebarSection]
actions: {}
intents:
  - id: github-repository-regression-intent
    type: hierarchy
    subject: primary
    relativeTo: context
    expectation: dominant
